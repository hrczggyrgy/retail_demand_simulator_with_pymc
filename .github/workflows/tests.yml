name: Tests

on:
  push:
  pull_request:

jobs:
  # Fast deterministic tests - run on every PR
  fast-tests:
    name: Fast Tests (unit, validation, features, choice_sets, model_structure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff
      - run: ruff check .
      - run: PYTHONPATH=. pytest -q tests/test_validation.py tests/test_features.py tests/test_choice_sets.py tests/test_model_structure.py -k "not slow" -n 1 --maxfail=5

  # Graph construction tests - run on every PR
  graph-tests:
    name: Graph Tests (model building without sampling)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff
      - run: PYTHONPATH=. pytest -q tests/test_model_structure.py tests/test_diagnostics.py -k "not slow" -n 1 --maxfail=3

  # Slow/MCMC integration tests - run on push to main, or manually
  mcmc-tests:
    name: MCMC Integration Tests (with sampling)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff
      - run: PYTHONPATH=. pytest -q tests/test_model_structure.py tests/test_scenarios.py -k "slow" -n 1 --maxfail=1 --timeout=120

  # Full smoke test - scheduled or manual
  smoke-test:
    name: Full Smoke Test (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff
      - run: PYTHONPATH=. pytest -q tests/ -n 1 --maxfail=1 --timeout=300
      - run: timeout 60 streamlit run app.py --server.headless=true || true
      - run: python -m compileall .

  # Lint and type check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install ruff mypy
      - run: ruff check .
      - run: mypy app.py engine.py engine_modules/ contracts.py demo_data.py --ignore-missing-imports