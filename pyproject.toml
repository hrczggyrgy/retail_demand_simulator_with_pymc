[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-analytics"
version = "0.1.0"
description = "Retail demand, pricing, and distribution analytics with Bayesian modeling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pymc>=5.10.0",
    "pytensor>=2.10.0",
    "arviz>=0.17.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "xarray>=2023.10.0",
    "netcdf4>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "mypy>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "T201", "T203"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"