[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-analytics"
version = "0.1.0"
description = "Retail demand, pricing, and distribution analytics with Bayesian modeling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pymc>=5.10.0",
    "pytensor>=2.10.0",
    "arviz>=0.17.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "xarray>=2023.10.0",
    "netcdf4>=1.6.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "mypy>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "PIE", "PT", "Q", "RSE", "ARG", "PTH", "ERA", "PD", "PL", "TRY", "ICN", "INT", "S", "TCH"]
ignore = ["S101", "T201", "T203"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"demo_data.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
strict_optional = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pymc",
    "arviz",
    "arviz_plots",
    "streamlit",
    "plotly",
    "xarray",
    "sklearn",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-q --disable-warnings --maxfail=1"

[tool.coverage.run]
source = ["engine", "app", "demo_data"]
omit = ["tests/*"]